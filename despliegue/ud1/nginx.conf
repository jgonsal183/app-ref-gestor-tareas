# Gestor de tareas · configuración de nginx para el contenedor web (UD1 · A1.3)
# Equivale al sitio /etc/nginx/sites-available/gestor-tareas de la fase 3 de la A1.2.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API admite adjuntos de hasta 5 MB; nginx limita a 1 MB si no se dice otra cosa.
    client_max_body_size 6m;

    # Las peticiones de la API van al contenedor api, que no publica ningún puerto.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
